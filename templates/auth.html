<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#f7f6fb">
<link rel="icon" type="image/png" href="/static/icons/icon-192.png">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DayLoop">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>DayLoop - Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --haze:#f7f6fb; --ink:#2d2a3e; --muted:#6d6985; --line:#e8e5f1; --soft:#f0eef8;
    --lilac:#6e60d8; --lilac-dk:#5f51c9; --danger:#b3394f;
    --font:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:var(--haze);
         color:var(--ink); font-family:var(--font); line-height:1.5; }
  .wrap { width:100%; max-width:380px; }
  .brand { display:flex; align-items:center; gap:10px; margin-bottom:28px; font-size:17px; font-weight:600; }
  .mark { width:30px; height:30px; border-radius:10px; background:var(--lilac); display:grid; place-items:center; }
  h1 { font-size:30px; font-weight:500; letter-spacing:-.02em; line-height:1.15; margin:0 0 6px; }
  .sub { color:var(--muted); margin:0 0 26px; }
  .sheet { background:#fff; border:1px solid var(--line); border-radius:24px; padding:28px; }
  label { display:block; font-size:13px; font-weight:500; color:var(--muted); margin-bottom:6px; }
  input { width:100%; padding:12px 14px; margin-bottom:16px; background:var(--soft); border:1px solid transparent;
          border-radius:12px; color:var(--ink); font:inherit; font-size:15px; }
  input:focus { outline:none; border-color:var(--lilac); background:#fff; box-shadow:0 0 0 3px rgba(110,96,216,.18); }
  .go { width:100%; padding:13px; border:none; border-radius:12px; background:var(--lilac); color:#fff;
        font:inherit; font-weight:600; font-size:15px; cursor:pointer; }
  .go:hover { background:var(--lilac-dk); }
  :focus-visible { outline:2px solid var(--lilac); outline-offset:3px; }
  .err { color:var(--danger); font-size:14px; min-height:22px; margin:-4px 0 8px; }
  .switch { text-align:center; margin:22px 0 0; font-size:14px; color:var(--muted); }
  .switch button { background:none; border:none; padding:0; font:inherit; color:var(--lilac); font-weight:600; cursor:pointer; }
  .switch button:hover { text-decoration:underline; }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <span class="mark">
      <svg width="18" height="18" viewBox="0 0 28 28" aria-hidden="true">
        <circle cx="14" cy="14" r="9" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round"
                stroke-dasharray="44 13" transform="rotate(-70 14 14)"/>
      </svg>
    </span>
    DayLoop
  </div>
  <h1 id="heading">Welcome back</h1>
  <p class="sub" id="subhead">Sign in to see your routines.</p>
  <main class="sheet">
    <div id="name-wrap" style="display:none">
      <label for="name">Your name</label>
      <input id="name" autocomplete="name">
    </div>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="email">
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" placeholder="At least 6 characters">
    <div class="err" id="err" role="alert"></div>
    <button class="go" id="go" onclick="submitForm()">Sign in</button>
  </main>
  <p class="switch"><span id="switch-text">New here?</span> <button id="switch-btn" onclick="toggleMode()">Create an account</button></p>
</div>

<script>
let mode = "login";
function toggleMode() {
  mode = mode === "login" ? "signup" : "login";
  const s = mode === "signup";
  document.getElementById("heading").textContent = s ? "Create your account" : "Welcome back";
  document.getElementById("subhead").textContent = s ? "Plan your week and track it every day." : "Sign in to see your routines.";
  document.getElementById("name-wrap").style.display = s ? "block" : "none";
  document.getElementById("go").textContent = s ? "Create account" : "Sign in";
  document.getElementById("switch-text").textContent = s ? "Already have an account?" : "New here?";
  document.getElementById("switch-btn").textContent = s ? "Sign in" : "Create an account";
  document.getElementById("err").textContent = "";
}
async function submitForm() {
  const body = {
    name: document.getElementById("name").value,
    email: document.getElementById("email").value,
    password: document.getElementById("password").value,
  };
  const res = await fetch("/api/" + mode, {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
  });
  const data = await res.json();
  if (res.ok) location.href = "/";
  else document.getElementById("err").textContent = data.error || "Something went wrong. Try again.";
}
document.addEventListener("keydown", e => { if (e.key === "Enter") submitForm(); });
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("/service-worker.js").catch(() => {}));
}
</script>
</body>
</html>
